name: Deploy to FTP
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy liturgy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER_LITURGY }}
          username: ${{ secrets.FTP_USERNAME_LITURGY }}
          password: ${{ secrets.FTP_PASSWORD_LITURGY }}
          local-dir: ./
          server-dir: /public_html/mitakachurch.com/liturgy/
          state-name: .ftp-deploy-sync-state-liturgy.json
          exclude: |
            **/.git*
            **/.git*/**
            README.md
